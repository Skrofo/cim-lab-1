# Directory containing checkpoint.pt and resolved_config.yaml.
run_dir: ???

data_dir: ${hydra:runtime.cwd}/data
output_dir: null
batch_size: 256
num_workers: 2
device: cuda

analysis:
  max_examples: 2000
  translation_pixels: [0, 1, 2, 3, 4, 5, 6]
  rotation_degrees: [0, 5, 10, 15, 20, 30, 45]
  contrast_factors: [0.5, 0.7, 0.9, 1.0, 1.1, 1.3, 1.5]

hydra:
  job:
    chdir: false
  run:
    dir: outputs/analysis/${now:%Y-%m-%d_%H-%M-%S}
