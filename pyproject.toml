[project]
name = "cim-lab-1"
version = "0.1.0"
description = "CIM Lab 1: architecture, augmentation and invariance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torch>=2.4",
    "torchvision>=0.19",
    "wandb>=0.18",
]

[project.scripts]
cim-train = "cim_lab_1.train:main"
cim-analyse = "cim_lab_1.analyse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cim_lab_1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
